name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
jobs:
  test:
    permissions:
      checks: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::Go files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d cmd internal
            exit 1
          fi
      - name: Run Go tests
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go build -o /tmp/helm-chart-oci ./cmd/helm-chart-oci
      - name: Validate AGENTS.md line count
        run: |
          MAX_LINES=300
          ACTUAL_LINES=$(wc -l < AGENTS.md)
          if [ "$ACTUAL_LINES" -gt "$MAX_LINES" ]; then
            echo "::error::AGENTS.md has $ACTUAL_LINES lines, must be <= $MAX_LINES"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version
      - name: Install pipenv
        run: pip install pipenv==$(cat .pipenv-version)
      - name: Create virtualenv
        run: pipenv sync
      - name: Run tests
        run: |
          pipenv run pytest --cov=verify_rpms --cov-report=xml:coverage.xml tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          use_oidc: true
          flags: unit-tests
          files: coverage.out,coverage.xml
          fail_ci_if_error: false
